name: Build installeur Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm install

      - name: Construire l'installeur (.exe)
        run: npm run dist

      - name: Mettre l'installeur à disposition (onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: installeur-windows
          path: dist/*.exe

      - name: Créer une Release GitHub avec l'installeur
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
