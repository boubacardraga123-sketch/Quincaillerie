name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm install

      - name: Construire l'installeur Windows
        run: npm run dist

      - name: Publier l'installeur
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/*.exe

      - name: Sauvegarder l'installeur (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: installeur-windows
          path: release/*.exe

