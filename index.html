<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>ETS. DIALLO AMADOU OURY — Gestion Stock & Factures</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a3a5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quincaillerie Diallo">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png" type="image/png">
<style>
  :root{
    --bg:#f0f4f8;
    --panel:#ffffff;
    --panel-2:#eef2f7;
    --line:#d0dce8;
    --text:#1a2533;
    --text-dim:#5a6b7e;
    --accent:#e8a23d;
    --accent-dim:#b8791a;
    --danger:#c0392b;
    --danger-bg:#fbe4df;
    --success:#2e7d52;
    --success-bg:#e4f3ea;
    --ink:#3e6fa8;
    --radius:10px;
    --font-display:"Segoe UI","Helvetica Neue",Arial,sans-serif;
    --font-body:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    --font-mono:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }
  ::selection{background:var(--accent);color:#1a1305;}

  header.topbar{
    background:linear-gradient(180deg,#2d5986,#1a3a5c);
    border-bottom:3px solid var(--accent);
    padding:14px 16px 12px;
    position:sticky; top:0; z-index:20;
  }
  header.topbar h1.shopname, header.topbar .shopsub{color:#fff;}
  header.topbar .shopsub{color:rgba(255,255,255,.75);}
  .brandrow{display:flex;align-items:center;gap:12px;}
  .brandmark{
    width:44px;height:44px;border-radius:8px;
    background:repeating-linear-gradient(45deg,var(--accent),var(--accent) 6px,#1a1305 6px,#1a1305 12px);
    flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-mono);font-weight:700;color:#1a1305;
  }
  .brandmark span{background:var(--panel);color:var(--accent);padding:2px 4px;border-radius:4px;font-size:11px;}
  h1.shopname{
    font-family:var(--font-display);
    font-weight:800;
    font-size:17px;
    letter-spacing:.03em;
    text-transform:uppercase;
    margin:0;
    line-height:1.15;
  }
  .shopsub{font-size:11px;color:var(--text-dim);margin-top:2px;}

  nav.tabs{
    display:flex; gap:6px; overflow-x:auto; margin-top:12px; padding-bottom:2px;
    scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    flex:0 0 auto;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text-dim);
    font-family:var(--font-display);
    text-transform:uppercase;
    font-size:11.5px;
    letter-spacing:.04em;
    font-weight:700;
    padding:9px 13px;
    border-radius:8px;
    cursor:pointer;
  }
  nav.tabs button.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#1a1305;
  }

  .alertbanner{
    display:none;
    align-items:center;
    gap:10px;
    background:var(--danger-bg);
    border-bottom:2px solid var(--danger);
    color:#a13a26;
    padding:10px 14px;
    font-size:12.5px;
    position:sticky; top:0; z-index:19;
  }
  .alertbanner .alert-icon{font-size:16px;flex:0 0 auto;}
  .alertbanner .alert-text{flex:1;min-width:0;line-height:1.4;}
  .alertbanner .alert-text b{color:#fff;}
  .alertbanner .alert-close{
    flex:0 0 auto;background:transparent;border:none;color:#a13a26;
    font-size:16px;cursor:pointer;padding:2px 6px;line-height:1;
  }
  @media (max-width:480px){
    .alertbanner{flex-wrap:wrap;}
    .alertbanner .alert-text{order:1;width:100%;}
  }

  main{padding:14px 14px 30px;max-width:820px;margin:0 auto;}

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:12px;
  }
  .card h2{
    font-family:var(--font-display);
    text-transform:uppercase;
    font-size:13px;
    letter-spacing:.05em;
    color:var(--accent);
    margin:0 0 10px;
    display:flex;align-items:center;justify-content:space-between;
    gap:8px;
  }
  .card h2 small{color:var(--text-dim);font-weight:400;text-transform:none;letter-spacing:0;font-size:11px;}

  .grid-kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .kpi{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px;
  }
  .kpi .val{font-family:var(--font-mono);font-size:20px;font-weight:700;color:var(--text);}
  .kpi .lbl{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}
  .kpi.warn .val{color:var(--danger);}
  .kpi.ok .val{color:var(--success);}

  label{display:block;font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.03em;margin:8px 0 4px;}
  input,select,textarea{
    width:100%;
    background:#1f2833;
    border:1px solid var(--line);
    color:#ece7dd;
    border-radius:7px;
    padding:9px 10px;
    font-size:14px;
    font-family:var(--font-body);
  }
  input[type=number]{font-family:var(--font-mono);}
  input[type=color]{padding:3px;height:42px;cursor:pointer;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
  input::placeholder,textarea::placeholder{color:#9aa7b5;}
  select option{background:#1f2833;color:#ece7dd;}

  .row{display:flex;gap:8px;}
  .row>*{flex:1;min-width:0;}

  button.btn{
    font-family:var(--font-display);
    text-transform:uppercase;
    font-weight:700;
    font-size:12px;
    letter-spacing:.03em;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--text);
    padding:10px 14px;
    cursor:pointer;
  }
  button.btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1305;}
  button.btn.danger{background:var(--danger-bg);border-color:var(--danger);color:#a13a26;}
  button.btn.ghost{background:transparent;}
  button.btn.small{padding:6px 9px;font-size:11px;}
  button.btn:active{transform:translateY(1px);}
  .btnbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  table th{
    text-align:left;font-family:var(--font-display);text-transform:uppercase;
    font-size:10.5px;letter-spacing:.03em;color:var(--text-dim);
    border-bottom:1px solid var(--line);padding:6px 4px;
  }
  table td{border-bottom:1px solid #e2e8f0;padding:7px 4px;vertical-align:middle;}
  table.tabular td.num, table.tabular th.num{font-family:var(--font-mono);text-align:right;}
  .tblwrap{overflow-x:auto;}
  tr.lowstock td{color:var(--danger);}
  .badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-family:var(--font-mono);font-weight:700;}
  .badge.low{background:var(--danger-bg);color:#a13a26;}
  .badge.ok{background:var(--success-bg);color:#1f6b45;}
  .badge.adj{background:var(--panel-2);color:var(--text-dim);}

  .empty{color:var(--text-dim);font-size:13px;padding:14px 4px;text-align:center;}

  .ligne-row{display:grid;grid-template-columns:1fr 52px 78px 32px;gap:6px;align-items:end;margin-bottom:6px;}
  .ligne-row label{margin:0 0 3px;}
  .ligne-total{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);grid-column:1/-1;text-align:right;margin-top:-3px;margin-bottom:2px;}

  .totalbox{
    background:var(--panel-2);border:1px dashed var(--accent-dim);border-radius:8px;
    padding:10px 12px;margin-top:10px;font-family:var(--font-mono);
  }
  .totalbox .line{display:flex;justify-content:space-between;padding:3px 0;font-size:13px;}
  .totalbox .line.grand{font-size:16px;font-weight:700;color:var(--accent);border-top:1px solid var(--line);margin-top:4px;padding-top:7px;}

  dialog{
    border:none;border-radius:var(--radius);background:var(--panel);color:var(--text);
    padding:0;max-width:420px;width:92vw;
  }
  dialog::backdrop{background:rgba(0,0,0,.6);}
  .dlg-body{padding:16px;}
  .dlg-actions{display:flex;justify-content:flex-end;gap:8px;padding:0 16px 16px;}

  .search{margin-bottom:10px;}

  footer.note{max-width:820px;margin:10px auto 0;padding:0 14px;color:var(--text-dim);font-size:11px;text-align:center;}

  /* ---- Zone d'impression (facture) : 1 exemplaire par page A4 portrait ---- */
  #printArea{display:none;}
  @page{ size: A4 portrait; margin: 14mm 16mm; }
  @media print{
    html, body{background:#ffffff!important;}
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{
      display:block;
      position:absolute;top:0;left:0;
      width:100%;
      background:#ffffff;
      color:#12314f;
    }
    .noprint{display:none!important;}
  }
  .inv-copy{
    width:100%;
    padding:0;
    box-sizing:border-box;
    position:relative;
    background:#ffffff;
    color:#12314f;
    overflow:hidden;
    page-break-after:always;
    break-after:page;
  }
  .inv-copy:last-child{page-break-after:auto;break-after:auto;}
  .inv-watermark{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:62%;
    max-width:150mm;
    height:auto;
    opacity:.10;
    z-index:0;
    pointer-events:none;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact;
  }
  .inv-content{position:relative;z-index:1;}
  .inv-copy-label{
    position:absolute; top:2mm; right:4mm;
    font-family:var(--font-mono); font-size:9px; letter-spacing:.05em;
    color:#7a93ad; text-transform:uppercase;
  }
  .inv-head{display:flex;flex-direction:column;border-bottom:2px solid var(--ink);padding-bottom:var(--head-pad,6px);margin-bottom:var(--head-mb,7px);font-family:var(--font-body);}
  .inv-shop-title{font-family:var(--font-display);font-weight:800;text-transform:uppercase;text-align:center;color:var(--ink);letter-spacing:.02em;font-size:var(--shop-title-fs,15px);margin:0 0 2px;}
  .inv-head-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .inv-logo-crop{width:var(--logohdr-w,100px);height:var(--logohdr-h,39px);background-repeat:no-repeat;background-size:100% 200%;flex:0 0 auto;-webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact;}
  .inv-logo-crop.top{background-position:0 0;}
  .inv-logo-crop.bot{background-position:0 100%;}
  .inv-head-center{flex:1 1 auto;text-align:center;font-size:var(--meta-fs,9.5px);color:#0c1f33;line-height:1.35;font-weight:500;}
  .inv-facture-label{font-family:var(--font-display);font-weight:800;font-size:var(--titre-fs,15px);letter-spacing:.04em;color:var(--ink);text-transform:uppercase;margin-top:4px;}
  .inv-client{border:1px solid var(--ink);border-radius:5px;padding:var(--client-pad,5px) 7px;margin-bottom:var(--client-mb,7px);font-size:var(--client-fs,10.5px);font-weight:600;color:#0c1f33;line-height:1.35;}
  .inv-table{width:100%;border-collapse:collapse;border:1.5px solid var(--ink);}
  .inv-table th{background:#eaf1fa;color:var(--ink);border:1px solid var(--ink);padding:var(--tab-pad,3px) 4px;font-size:var(--tab-th-fs,8.5px);text-transform:uppercase;font-family:var(--font-display);line-height:1.15;}
  .inv-table td{border:1px solid var(--ink);padding:var(--tab-pad,3px) 4px;font-size:var(--tab-td-fs,9.5px);font-family:var(--font-mono);font-weight:600;line-height:1.2;color:#0c1f33;}
  .inv-table td.des{font-family:var(--font-body);}
  .inv-totals{display:flex;justify-content:flex-end;margin-top:5px;}
  .inv-totals table{border-collapse:collapse;}
  .inv-totals td{padding:1px 8px;font-family:var(--font-mono);font-size:var(--totals-fs,10px);font-weight:600;color:#0c1f33;}
  .inv-totals tr.grand td{font-weight:800;font-size:var(--totals-grand-fs,11.5px);border-top:1.5px solid var(--ink);}
  .inv-footer{display:flex;gap:10px;align-items:flex-end;margin-top:var(--footer-mt,10px);}
  .inv-footer-right{flex:1;min-width:0;}
  .inv-lettres{font-size:var(--lettres-fs,9px);font-style:italic;margin-bottom:4px;}
  .inv-sign{display:flex;justify-content:space-between;font-size:var(--sign-fs,9.5px);}
  .inv-sign div{text-align:center;width:45%;border-top:1px solid var(--ink);padding-top:3px;}
  .inv-foot-note{margin-top:6px;font-size:var(--footnote-fs,8px);color:#5a7593;}

  /* ---- Zone d'impression (rapport journalier) : pleine page A4 paysage ---- */
  .rapport-doc{
    width:100%;
    padding:0;
    box-sizing:border-box;
    background:#ffffff;
    color:#12314f;
    font-family:var(--font-body);
    font-size:11px;
  }
  .rapport-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:7px;margin-bottom:9px;}
  .rapport-head-left{display:flex;align-items:flex-start;gap:9px;}
  .rapport-logo{width:46px;height:46px;object-fit:contain;object-position:left top;flex:0 0 auto;-webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact;}
  .rapport-head h2{font-family:var(--font-display);text-transform:uppercase;font-size:15.5px;margin:0 0 3px;color:var(--ink);}
  .rapport-head .meta{font-size:10.5px;color:#0c1f33;line-height:1.4;}
  .rapport-title{font-family:var(--font-display);font-size:16px;font-weight:800;letter-spacing:.05em;color:var(--ink);text-transform:uppercase;border:1.5px solid var(--ink);padding:3px 10px;height:fit-content;text-align:right;}
  .rapport-title .rdate{display:block;font-size:12px;font-weight:700;letter-spacing:0;text-transform:none;margin-top:3px;}
  .rapport-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px;}
  .rapport-kpi{border:1px solid var(--ink);border-radius:5px;padding:6px 8px;}
  .rapport-kpi .k-val{font-family:var(--font-mono);font-size:14.5px;font-weight:800;color:var(--ink);}
  .rapport-kpi .k-lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.03em;color:#3f5266;margin-top:1px;}
  .rapport-section{margin-bottom:9px;}
  .rapport-section h3{font-family:var(--font-display);text-transform:uppercase;font-size:11.5px;letter-spacing:.04em;color:var(--ink);margin:0 0 4px;border-bottom:1px solid var(--ink);padding-bottom:2px;}
  .rapport-table{width:100%;border-collapse:collapse;}
  .rapport-table th{background:#eaf1fa;color:var(--ink);border:1px solid var(--ink);padding:4px 5px;font-size:9.5px;text-transform:uppercase;font-family:var(--font-display);text-align:left;}
  .rapport-table td{border:1px solid var(--ink);padding:4px 5px;font-size:10.5px;font-weight:600;font-family:var(--font-mono);color:#0c1f33;}
  .rapport-table td.txt{font-family:var(--font-body);}
  .rapport-table td.num, .rapport-table th.num{text-align:right;}
  .rapport-empty{font-size:10.5px;color:#3f5266;font-style:italic;padding:4px 2px;}
  .rapport-foot{display:flex;justify-content:space-between;font-size:10.5px;margin-top:16px;}
  .rapport-foot div{text-align:center;width:30%;border-top:1px solid var(--ink);padding-top:3px;}

  /* ---- Écran de connexion ---- */
  .login-screen{
    position:fixed;inset:0;z-index:100;
    background:var(--bg);
    display:flex;align-items:center;justify-content:center;
    padding:20px;
  }
  .login-card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px;width:100%;max-width:340px;
  }
  .login-brand{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .login-title{font-family:var(--font-display);font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.03em;}
  .login-sub{font-size:11px;color:var(--text-dim);margin-top:2px;}
  .login-error{color:var(--danger);font-size:12px;min-height:16px;margin-top:6px;}
  body.locked #app, body.locked header.topbar nav.tabs, body.locked .alertbanner, body.locked footer.note{display:none;}

  .syncbar{
    display:flex; align-items:center; gap:8px;
    font-size:11px; color:rgba(255,255,255,.85);
    margin-top:8px; padding:4px 0;
  }
  .syncbar .dot{
    width:8px;height:8px;border-radius:50%;
    background:#e8a23d; flex:0 0 auto;
    transition:background .2s;
  }
  .syncbar .dot.ok{ background:#2ecc71; }
  .syncbar .dot.off{ background:#8a97a8; }
  .syncbar .dot.err{ background:#e74c3c; }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="login-brand">
      <div class="brandmark"><span>EDA</span></div>
      <div>
        <div class="login-title">ETS. DIALLO AMADOU OURY</div>
        <div class="login-sub">Accès protégé — Gestion Stock &amp; Factures</div>
      </div>
    </div>
    <label>Mot de passe</label>
    <input type="password" id="loginPassword" placeholder="Entrez le mot de passe" autocomplete="current-password">
    <div id="loginError" class="login-error"></div>
    <div class="btnbar"><button class="btn primary" id="btnLogin" style="width:100%;">Se connecter</button></div>
  </div>
</div>

<header class="topbar">
  <div class="brandrow">
    <div class="brandmark"><span id="brandInitials">EDA</span></div>
    <div>
      <h1 class="shopname" id="hdrShopName">ETS. DIALLO AMADOU OURY</h1>
      <div class="shopsub" id="hdrShopSub">Gestion de stock & factures</div>
    </div>
    <button class="btn small ghost noprint" id="btnInstallApp" style="margin-left:auto;display:none;">📲 Installer l'app</button>
    <button class="btn small ghost noprint" id="btnLogout">Déconnexion</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <div class="syncbar noprint" id="syncBar" title="Vous pouvez écrire sans connexion : tout est enregistré sur l'appareil, puis envoyé automatiquement vers les autres appareils dès que le réseau revient."><span class="dot" id="syncDot"></span><span id="syncText">Connexion…</span></div>
</header>

<div class="alertbanner noprint" id="stockAlertBanner"></div>
<div class="alertbanner noprint" id="detteAlertBanner"></div>

<main id="app"></main>

<footer class="note">Données synchronisées en ligne entre vos appareils — fonctionne aussi sans connexion (synchro automatique au retour du réseau).</footer>

<div id="printArea"></div>

<dialog id="dlgConfirm">
  <div class="dlg-body">
    <h2 style="margin-top:0;">Confirmer</h2>
    <p id="dlgConfirmMsg"></p>
  </div>
  <div class="dlg-actions">
    <button class="btn ghost" id="dlgConfirmCancel">Annuler</button>
    <button class="btn danger" id="dlgConfirmOk">Confirmer</button>
  </div>
</dialog>

<dialog id="dlgPaiement">
  <div class="dlg-body">
    <h2 style="margin-top:0;">Encaisser un paiement</h2>
    <p id="dlgPaiementInfo" style="color:var(--text-dim);font-size:13px;"></p>
    <label>Montant reçu (FG)</label>
    <input type="number" id="dlgPaiementMontant" min="1" step="1">
  </div>
  <div class="dlg-actions">
    <button class="btn ghost" id="dlgPaiementCancel">Annuler</button>
    <button class="btn primary" id="dlgPaiementOk">Encaisser</button>
  </div>
</dialog>

<script>

var db = null;

var applyingRemote = false;    // évite de renvoyer vers le cloud ce qu'on vient de recevoir du cloud
var cloudPushTimer = null;
var lastLocalUpdate = 0;

function setSyncUI(mode, text){
  var dot = document.getElementById("syncDot");
  var txt = document.getElementById("syncText");
  if(!dot || !txt) return;
  dot.className = "dot" + (mode ? " " + mode : "");
  txt.textContent = text;
}

function initFirebaseSync(){
  try{
    var fbApp = firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    try{
      db.enablePersistence({synchronizeTabs:true});
    }catch(e){ /* déjà activé ou navigateur non compatible : on continue quand même */ }
    cloudDocRef = db.collection("quincaillerie_diallo_data").doc("state");
    setSyncUI("", "Connexion au serveur…");

    cloudDocRef.onSnapshot(function(snap){
      var fromCache = snap.metadata.fromCache;
      var data = snap.data();
      if(data && data.app){
        // n'écrase les données locales que si la version distante est plus récente
        var remoteUpdate = data.updatedAt || 0;
        if(remoteUpdate >= lastLocalUpdate){
          applyingRemote = true;
          APP = data.app;
          if(!APP.produits) APP.produits=[];
          if(!APP.clients) APP.clients=[];
          if(!APP.factures) APP.factures=[];
          if(!APP.mouvements) APP.mouvements=[];
          if(!APP.achats) APP.achats=[];
          if(!APP.settings) APP.settings={};
          APP.factures.forEach(function(f){
            if(!f.paiements) f.paiements=[];
            f.reste = factureReste(f);
          });
          lastLocalUpdate = remoteUpdate;
          try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(APP)); }catch(e){}
          applyingRemote = false;
          if(isAuthenticated()) render();
        }
      } else if(!fromCache){
        // aucun document distant encore : on pousse l'état local actuel comme référence initiale
        pushToCloud(true);
      }
      cloudReady = true;
      setSyncUI(fromCache ? "off" : "ok", fromCache ? "Hors connexion (données locales)" : "Synchronisé");
    }, function(err){
      setSyncUI("err", "Erreur de synchro");
      console.error("Firestore onSnapshot error:", err);
    });
  }catch(e){
    setSyncUI("err", "Synchro indisponible");
    console.error("initFirebaseSync error:", e);
  }
}

function pushToCloud(immediate){
  if(!cloudDocRef) return;
  var doPush = function(){
    lastLocalUpdate = Date.now();
    setSyncUI("", "Synchronisation…");
    cloudDocRef.set({ app: APP, updatedAt: lastLocalUpdate }).then(function(){
      setSyncUI("ok", "Synchronisé");
    }).catch(function(err){
      setSyncUI("off", "Hors connexion (sera synchronisé)");
    });
  };
  if(immediate){ doPush(); return; }
  clearTimeout(cloudPushTimer);
  cloudPushTimer = setTimeout(doPush, 800);
}

function load(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    APP = raw ? JSON.parse(raw) : defaultApp();
    if(!APP.produits) APP.produits=[];
    if(!APP.clients) APP.clients=[];
    if(!APP.factures) APP.factures=[];
    if(!APP.mouvements) APP.mouvements=[];
    if(!APP.achats) APP.achats=[];
    if(!APP.settings) APP.settings={ utilisateurActif:"", seuilDetteJours:30 };
    if(APP.settings.seuilDetteJours==null) APP.settings.seuilDetteJours=30;
    if(APP.settings.utilisateurActif==null) APP.settings.utilisateurActif="";
    if(!APP.settings.motDePasse) APP.settings.motDePasse="bhds123";
    if(APP.settings.masquerHistorique==null) APP.settings.masquerHistorique=false;
    if(!APP.settings.theme) APP.settings.theme={ bg:"#f0f4f8", panel:"#ffffff", panel2:"#eef2f7", accent:"#e8a23d", text:"#1a2533" };
    if(!APP.nextNumero) APP.nextNumero=1;
    if(!APP.shop) APP.shop = defaultApp().shop;
    // migration : s'assurer que chaque facture a un tableau de paiements et un reste à jour
    APP.factures.forEach(function(f){
      if(!f.paiements) f.paiements=[];
      f.reste = factureReste(f);
    });
    if(APP.draftFacture && typeof APP.draftFacture==="object"){
      draft = APP.draftFacture;
      if(!draft.lignes || !draft.lignes.length) draft.lignes=[{designation:"",qte:1,pu:0}];
    }
  }catch(e){
    APP = defaultApp();
  }
}
function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(APP));
  alertDismissed = false; // toute modification de données réaffiche l'alerte si besoin
  detteAlertDismissed = false;
  if(!applyingRemote) pushToCloud(false);
}
function applyTheme(){
  var t = (APP.settings && APP.settings.theme) || {};

/* ============ STATISTIQUES DE VENTES PAR ARTICLE ============ */
function ventesParArticle(){
  var map = {};
  APP.factures.forEach(function(f){
    (f.lignes||[]).forEach(function(l){
      var key = (l.designation||"").trim();
      if(!key) return;
      if(!map[key]) map[key] = {designation:key, qte:0, dernierDate:null};
      map[key].qte += Number(l.qte)||0;
      if(!map[key].dernierDate || f.date>map[key].dernierDate) map[key].dernierDate = f.date;
    });
  });
  return map;
}
function topArticlesVendus(n){
  var map = ventesParArticle();
  return Object.keys(map).map(function(k){ return map[k]; })
    .sort(function(a,b){ return b.qte-a.qte; }).slice(0,n);
}
function articlesQuiNeBougentPas(n){
  var map = ventesParArticle();
  var today = todayISO();
  var list = APP.produits.map(function(p){
    var v = map[p.designation];
    var jours = (v && v.dernierDate) ? Math.floor((new Date(today)-new Date(v.dernierDate))/86400000) : null;
    return {designation:p.designation, qte:p.qte, dernierDate: v?v.dernierDate:null, joursDepuis: jours};
  }).sort(function(a,b){
    if(a.dernierDate===null && b.dernierDate===null) return (a.designation||"").localeCompare(b.designation||"");
    if(a.dernierDate===null) return -1;
    if(b.dernierDate===null) return 1;
    return a.dernierDate.localeCompare(b.dernierDate);
  });
  return list.slice(0,n);
}

/* ============ UTILITAIRES ============ */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
/* Exécute fn() (une action d'impression) en suggérant temporairement un nom
   de fichier au navigateur — utile quand l'utilisateur choisit "Enregistrer
   en PDF" dans la boîte d'impression, le nom proposé sera pertinent au lieu
   du titre générique de l'appli. */
function withPdfFilename(nomFichier, fn){
  var ancienTitre = document.title;
  var restaure = function(){
    document.title = ancienTitre;
    window.removeEventListener("afterprint", restaure);
  };
  document.title = nomFichier;
  window.addEventListener("afterprint", restaure);
  setTimeout(restaure, 6000); // filet de sécurité si "afterprint" ne se déclenche pas
  fn();
}
function fmt(n){
  n = Math.round(Number(n||0));
  return n.toLocaleString("fr-FR") + " FG";
}
function fmtNum(n){ return Math.round(Number(n||0)).toLocaleString("fr-FR"); }
function todayISO(){
  var d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function fmtDate(iso){
  if(!iso) return "";
  var p = iso.split("-");
  if(p.length!==3) return iso;
  return p[2]+"/"+p[1]+"/"+p[0];
}
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function numeroFacture(n){ return "FAC-"+String(n).padStart(4,"0"); }

/* Conversion nombre -> lettres (français, approximatif, suffisant pour factures) */
function nombreEnLettres(n){
  n = Math.floor(Math.abs(Number(n)||0));
  if(n===0) return "zéro";
  var unites=["","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf"];
  var dizaines=["","","vingt","trente","quarante","cinquante","soixante","soixante","quatre-vingt","quatre-vingt"];
  function troisChiffres(num){
    var s="";
    var c=Math.floor(num/100), r=num%100;
    if(c>0){ s += (c>1? unites[c]+" cent" : "cent"); if(c>1 && r===0) s+="s"; if(r>0) s+=" "; }
    if(r>0){
      if(r<20){ s+=unites[r]; }
      else{
        var d=Math.floor(r/10), u=r%10;
        if(d===7||d===9){ s+= dizaines[d] + "-" + unites[10+u]; }
        else{
          s+=dizaines[d];
          if(u===1 && d!==8) s+="-et-un";
          else if(u>0) s+="-"+unites[u];
          else if(d===8) s+="s";
        }
      }
    }
    return s;
  }
  var tranches=[{val:1000000000,mot:"milliard"},{val:1000000,mot:"million"},{val:1000,mot:"mille"}];
  var reste=n, parts=[];
  for(var i=0;i<tranches.length;i++){
    var t=tranches[i];
    if(reste>=t.val){
      var q=Math.floor(reste/t.val);
      reste=reste%t.val;
      if(t.val===1000 && q===1){ parts.push("mille"); }
      else{ parts.push(troisChiffres(q)+" "+t.mot+(q>1 && t.mot!=="mille" ? "s":"")); }
    }
  }
  if(reste>0 || parts.length===0) parts.push(troisChiffres(reste));
  return parts.join(" ").replace(/\s+/g," ").trim();
}

function renderTabs(){
  var nav = document.getElementById("tabs");

  var tabs = TABS.filter(function(t){ return !(masque && t.id==="historique"); });

  }).join("");
  Array.prototype.forEach.call(nav.querySelectorAll("button"), function(b){

      render();
    });

function render(){
  // Préserve le focus, la position du curseur et le défilement de la page
  // pour que render() (qui reconstruit tout le HTML) ne fasse pas perdre le
  // focus ni la position de lecture à chaque frappe/clic.
  var active = document.activeElement;
  var activeId = active && active.id ? active.id : null;
  var selStart = null, selEnd = null;
  if(active && typeof active.selectionStart === "number"){
    try{ selStart = active.selectionStart; selEnd = active.selectionEnd; }catch(e){}
  }
  var scrollY = window.scrollY;

  if(currentTab==="historique" && APP.settings && APP.settings.masquerHistorique) currentTab = "dashboard";
  renderTabs();
  document.getElementById("hdrShopName").textContent = APP.shop.nom || "Quincaillerie";
  document.getElementById("brandInitials").textContent = (APP.shop.nom||"Q").split(/\s+/).map(function(w){return w[0];}).join("").slice(0,3).toUpperCase();
  var app = document.getElementById("app");
  if(currentTab==="dashboard") app.innerHTML = viewDashboard();
  else if(currentTab==="stock") app.innerHTML = viewStock();
  else if(currentTab==="facture") app.innerHTML = viewFacture();
  else if(currentTab==="historique") app.innerHTML = viewHistorique();
  else if(currentTab==="clients") app.innerHTML = viewClients();
  else if(currentTab==="parametres") app.innerHTML = viewParametres();
  renderAlertBanner();
  renderDetteBanner();
  attachHandlers();

  if(activeId){
    var el = document.getElementById(activeId);
    if(el){
      el.focus();
      if(selStart!=null && el.setSelectionRange){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
  window.scrollTo(0, scrollY);
}

function findClientAdresse(nom){
  nom = (nom||"").trim().toLowerCase();
  if(!nom) return "";
  var fiche = (APP.clients||[]).find(function(c){ return (c.nom||"").trim().toLowerCase()===nom; });

  return "";
}

/* ============ CLIENTS & CRÉANCES ============ */
function clientsSummary(){
  var map = {};
  APP.factures.forEach(function(f){
    var key = (f.clientNom||"").trim() || "Client non renseigné";
    if(!map[key]) map[key] = {nom:key, nbFactures:0, total:0, paye:0, du:0, factures:[]};
    map[key].nbFactures += 1;
    map[key].total += f.total;
    map[key].paye += facturePaye(f);
    map[key].du += f.reste;
    map[key].factures.push(f);
  });
  return Object.keys(map).map(function(k){ return map[k]; }).sort(function(a,b){
    return b.du-a.du || b.total-a.total;
  });
}

function joursDetteClient(c){
  var impayees = c.factures.filter(function(f){ return f.reste>0; }).slice().sort(function(a,b){ return a.date.localeCompare(b.date); });
  if(!impayees.length) return 0;
  var plusAncienne = impayees[0];
  return Math.floor((new Date(todayISO())-new Date(plusAncienne.date))/86400000);
}

/* ============ IMPRESSION FACTURE (2 exemplaires / page A4 paysage) ============ */
function invoiceDensityStyle(nbLignes){
  // Calcule un facteur de réduction (t) selon le nombre d'articles, pour que
  // la facture tienne toujours sur une seule page quel que soit le nombre
  // de lignes achetées.
  var t;
  if(nbLignes<=14) t = 1;
  else t = Math.max(0.7, 1 - (nbLignes-14)*0.012);
  function px(v, min){ return Math.max(min||0, +(v*t).toFixed(2))+'px'; }
  var vars = {
    '--tab-th-fs': px(13.5,10),
    '--tab-td-fs': px(15,11),
    '--tab-pad': px(5,2.5),
    '--head-fs': px(19,15),
    '--titre-fs': px(22,16),
    '--shop-title-fs': px(22,16),
    '--logohdr-w': px(180,125),
    '--logohdr-h': px(71,49),
    '--meta-fs': px(14,11),
    '--client-fs': px(16,12),
    '--client-pad': px(7,3.5),
    '--client-mb': px(9,4),
    '--totals-fs': px(15,12),
    '--totals-grand-fs': px(18,14),
    '--lettres-fs': px(13,10),
    '--sign-fs': px(14,11),
    '--footnote-fs': px(11,9),
    '--logo-size': px(105,65),
    '--head-pad': px(8,4),
    '--head-mb': px(9,4),
    '--footer-mt': px(13,5)
  };
  return Object.keys(vars).map(function(k){ return k+':'+vars[k]; }).join(';');
}

function printFacture(f){

  printArea.innerHTML = html;

  var nomFichier = "Facture_"+numeroFacture(f.numero)+"_"+nomClient;
  // On s'assure que le logo (et toute autre image) est bien chargé avant
  // de déclencher l'impression, sinon certains navigateurs (surtout sur
  // mobile) impriment une zone vide à la place du logo.
  var imgs = printArea.querySelectorAll("img");
  var pending = 0;
  var lance = false;
  function lancerImpression(){
    if(lance) return;
    lance = true;
    withPdfFilename(nomFichier, function(){ window.print(); });
  }
  Array.prototype.forEach.call(imgs, function(img){
    if(!img.complete || img.naturalWidth===0){
      pending++;
      img.addEventListener("load", function(){ pending--; if(pending<=0) lancerImpression(); });
      img.addEventListener("error", function(){ pending--; if(pending<=0) lancerImpression(); });
    }
  });
  // Sécurité : si au bout de 1.5s les images ne sont toujours pas prêtes,
  // on imprime quand même pour ne pas bloquer l'utilisateur.
  setTimeout(lancerImpression, 1500);
  if(pending===0) lancerImpression();
}

/* ============ IMPRESSION RAPPORT JOURNALIER (1 page A4 paysage) ============ */
function buildRapportJournalier(dateISO){
  var s = APP.shop;
  var facturesJour = APP.factures.filter(function(f){ return f.date===dateISO; })
    .slice().sort(function(a,b){ return a.numero-b.numero; });
  var caJour = facturesJour.reduce(function(sum,f){ return sum+f.total; },0);
  var avanceJour = facturesJour.reduce(function(sum,f){ return sum+(Number(f.avance)||0); },0);
  var resteGenereJour = facturesJour.reduce(function(sum,f){ return sum+(f.total-(Number(f.avance)||0)); },0);

  var paiementsJour = [];
  APP.factures.forEach(function(f){
    (f.paiements||[]).forEach(function(p){
      if(p.date===dateISO) paiementsJour.push({numero:f.numero, clientNom:f.clientNom, montant:p.montant});
    });
  });
  var totalPaiementsJour = paiementsJour.reduce(function(sum,p){ return sum+(Number(p.montant)||0); },0);
  var totalEncaisseJour = avanceJour + totalPaiementsJour;

  var mouvementsJour = (APP.mouvements||[]).filter(function(m){ return (m.date||"").slice(0,10)===dateISO; })
    .slice().sort(function(a,b){ return (a.date||"").localeCompare(b.date||""); });

  var produitsVendusMap = {};
  facturesJour.forEach(function(f){
    (f.lignes||[]).forEach(function(l){
      var nom = (l.designation||"").trim();
      if(!nom) return;
      if(!produitsVendusMap[nom]) produitsVendusMap[nom] = {designation:nom, qte:0, total:0};
      produitsVendusMap[nom].qte += Number(l.qte)||0;
      produitsVendusMap[nom].total += (Number(l.qte)||0)*(Number(l.pu)||0);
    });
  });
  var produitsVendusJour = Object.keys(produitsVendusMap).map(function(k){ return produitsVendusMap[k]; })
    .sort(function(a,b){ return b.total-a.total; });
  var totalArticlesVendusJour = produitsVendusJour.reduce(function(s,p){ return s+p.qte; },0);

  var achatsJour = (APP.achats||[]).filter(function(a){ return a.date===dateISO; });
  var totalAchatsJour = achatsJour.reduce(function(sum,a){ return sum+(Number(a.qte)||0)*(Number(a.prixAchat)||0); },0);

  var enAlerte = APP.produits.filter(function(p){ return p.qte<=p.seuilAlerte; });

  var mvLabel = {entree:"Entrée", sortie:"Sortie", ajustement:"Ajustement"};

  var kpis = [
    {val: facturesJour.length, lbl:"Factures émises"},
    {val: fmt(caJour), lbl:"Chiffre d'affaires du jour"},
    {val: fmt(totalEncaisseJour), lbl:"Total encaissé du jour"},
    {val: fmt(resteGenereJour), lbl:"Reste à payer généré"},
    {val: totalArticlesVendusJour, lbl:"Articles vendus (qté)"},
    {val: achatsJour.length+" ("+fmt(totalAchatsJour)+")", lbl:"Réapprovisionnements"},
    {val: mouvementsJour.length, lbl:"Mouvements de stock"},
    {val: enAlerte.length, lbl:"Articles en alerte (actuel)"},
    {val: APP.produits.length, lbl:"Articles référencés"}
  ];

  var facturesRows = facturesJour.length ? facturesJour.map(function(f){
    return '<tr><td>'+numeroFacture(f.numero)+'</td><td class="txt">'+esc(f.clientNom||"—")+'</td>'+
      '<td class="num">'+fmtNum(f.total)+'</td><td class="num">'+fmtNum(f.avance)+'</td><td class="num">'+fmtNum(f.reste)+'</td></tr>';
  }).join("") : '';

  var produitsVendusRows = produitsVendusJour.length ? produitsVendusJour.map(function(p){
    return '<tr><td class="txt">'+esc(p.designation)+'</td><td class="num">'+fmtNum(p.qte)+'</td>'+
      '<td class="num">'+fmtNum(p.qte? Math.round(p.total/p.qte) : 0)+'</td><td class="num">'+fmtNum(p.total)+'</td></tr>';
  }).join("") : '';

  var paiementsRows = paiementsJour.length ? paiementsJour.map(function(p){
    return '<tr><td>'+numeroFacture(p.numero)+'</td><td class="txt">'+esc(p.clientNom||"—")+'</td><td class="num">'+fmtNum(p.montant)+'</td></tr>';
  }).join("") : '';

  var mouvementsRows = mouvementsJour.length ? mouvementsJour.map(function(m){
    return '<tr><td>'+fmtDateTimeShort(m.date).slice(0,5)+'</td><td class="txt">'+esc(m.designation)+'</td>'+
      '<td class="txt">'+(mvLabel[m.type]||m.type)+'</td><td class="num">'+fmtNum(m.qte)+'</td><td class="txt">'+esc(m.motif||"")+'</td></tr>';
  }).join("") : '';

  var achatsRows = achatsJour.length ? achatsJour.map(function(a){
    return '<tr><td class="txt">'+esc(a.designation)+'</td><td class="num">'+fmtNum(a.qte)+'</td>'+
      '<td class="num">'+fmtNum(a.prixAchat)+'</td><td class="num">'+fmtNum((Number(a.qte)||0)*(Number(a.prixAchat)||0))+'</td>'+
      '<td class="txt">'+esc(a.fournisseur||"—")+'</td></tr>';
  }).join("") : '';

  function section(title, rows, headHtml, colSpan){
    return '<div class="rapport-section"><h3>'+esc(title)+'</h3>'+
      (rows ? '<table class="rapport-table"><thead><tr>'+headHtml+'</tr></thead><tbody>'+rows+'</tbody></table>'
        : '<div class="rapport-empty">Aucune donnée pour cette journée.</div>')+
    '</div>';
  }

  return ''+
  '<div class="rapport-doc">'+
    '<div class="rapport-head">'+
      '<div class="rapport-head-left">'+
        '<img class="rapport-logo" src="'+LOGO_DATA_URI+'" alt="">'+
        '<div>'+
          '<h2>'+esc(s.nom)+'</h2>'+
          '<div class="meta">'+esc(s.activite)+'<br>'+esc(s.detail)+'<br>'+esc(s.adresse)+'<br>'+
          'Tél : '+esc(s.tel1)+(s.tel2? ' / '+esc(s.tel2):'')+(s.telAutre? ' / '+esc(s.telAutre):'')+'</div>'+
        '</div>'+
      '</div>'+
      '<div class="rapport-title">Rapport journalier<span class="rdate">'+fmtDate(dateISO)+'</span></div>'+
    '</div>'+
    '<div class="rapport-kpis">'+
      kpis.map(function(k){ return '<div class="rapport-kpi"><div class="k-val">'+k.val+'</div><div class="k-lbl">'+esc(k.lbl)+'</div></div>'; }).join("")+
    '</div>'+
    section("Factures émises", facturesRows, '<th>N°</th><th>Client</th><th class="num">Total</th><th class="num">Payé comptant</th><th class="num">Reste</th>')+
    section("Produits vendus", produitsVendusRows, '<th>Article</th><th class="num">Qté vendue</th><th class="num">P.U. moyen</th><th class="num">Total</th>')+
    section("Paiements encaissés (créances)", paiementsRows, '<th>Facture</th><th>Client</th><th class="num">Montant</th>')+
    section("Mouvements de stock", mouvementsRows, '<th>Heure</th><th>Article</th><th>Type</th><th class="num">Qté</th><th>Motif</th>')+
    section("Réapprovisionnements", achatsRows, '<th>Article</th><th class="num">Qté</th><th class="num">P.U. achat</th><th class="num">Total</th><th>Fournisseur</th>')+
    '<div class="rapport-foot">'+
      '<div>Caissier</div><div>Gérant</div><div>Contrôle</div>'+
    '</div>'+
    '<div class="inv-foot-note" style="margin-top:8px;">Rapport généré le '+fmtDate(todayISO())+' — opérateur : '+esc(utilisateurActif())+'</div>'+
  '</div>';
}

/* ============ ACTIONS ============ */
function confirmDialog(msg, onOk){
  var dlg = document.getElementById("dlgConfirm");
  document.getElementById("dlgConfirmMsg").textContent = msg;
  dlg.showModal();
  var okBtn = document.getElementById("dlgConfirmOk");
  var cancelBtn = document.getElementById("dlgConfirmCancel");
  function cleanup(){ okBtn.removeEventListener("click", onOkH); cancelBtn.removeEventListener("click", onCancelH); }
  function onOkH(){ cleanup(); dlg.close(); onOk(); }
  function onCancelH(){ cleanup(); dlg.close(); }
  okBtn.addEventListener("click", onOkH);
  cancelBtn.addEventListener("click", onCancelH);
}

function openPaiementDialog(factureId){
  var f = APP.factures.find(function(x){ return x.id===factureId; });
  if(!f) return;
  var reste = factureReste(f);
  if(reste<=0){ alert("Cette facture est déjà entièrement payée."); return; }
  var dlg = document.getElementById("dlgPaiement");
  document.getElementById("dlgPaiementInfo").textContent = numeroFacture(f.numero)+" — "+(f.clientNom||"Client")+" — Reste dû : "+fmt(reste);
  var inp = document.getElementById("dlgPaiementMontant");
  inp.value = reste;
  inp.max = reste;
  dlg.showModal();
  var okBtn = document.getElementById("dlgPaiementOk");
  var cancelBtn = document.getElementById("dlgPaiementCancel");
  function cleanup(){ okBtn.removeEventListener("click", onOkH); cancelBtn.removeEventListener("click", onCancelH); }
  function onOkH(){
    var montant = Number(inp.value);
    if(!montant || montant<=0){ alert("Montant invalide."); return; }
    if(montant > reste){
      if(!confirm("Le montant saisi ("+fmt(montant)+") dépasse le reste dû ("+fmt(reste)+"). Continuer quand même ?")) return;
    }
    f.paiements = f.paiements||[];
    f.paiements.push({id:uid(), date: todayISO(), montant: montant});
    f.reste = factureReste(f);
    cleanup(); dlg.close();
    save(); render();
  }
  function onCancelH(){ cleanup(); dlg.close(); }
  okBtn.addEventListener("click", onOkH);
  cancelBtn.addEventListener("click", onCancelH);
}

function attachHandlers(){
  var app = document.getElementById("app");

  // DASHBOARD
  var btnGoClients = app.querySelector('[data-action="goClients"]');
  if(btnGoClients) btnGoClients.addEventListener("click", function(){
    currentTab = "clients"; render();
  });

  // STOCK: ajout
  var btnAdd = document.getElementById("btnAddProduit");
  if(btnAdd) btnAdd.addEventListener("click", function(){
    var designation = document.getElementById("fDesignation").value.trim();
    if(!designation){ alert("Merci de saisir une désignation."); return; }
    var nouveauProduit = {
      id: uid(),
      ref: document.getElementById("fRef").value.trim(),
      designation: designation,
      unite: document.getElementById("fUnite").value.trim()||"pièce",
      qte: Number(document.getElementById("fQte").value)||0,
      seuilAlerte: Number(document.getElementById("fSeuil").value)||0,
      prixAchat: Number(document.getElementById("fPrixAchat").value)||0,
      prixVente: Number(document.getElementById("fPrixVente").value)||0
    };
    APP.produits.push(nouveauProduit);
    if(nouveauProduit.qte>0) logMouvement(nouveauProduit.id, nouveauProduit.designation, "entree", nouveauProduit.qte, "Création de l'article (stock initial)");
    save(); render();
  });

  var stockSearch = document.getElementById("stockSearch");
  if(stockSearch) stockSearch.addEventListener("input", function(){ stockFilter=stockSearch.value; render(); });

  var histSearch = document.getElementById("histSearch");
  if(histSearch) histSearch.addEventListener("input", function(){ histFilter=histSearch.value; render(); });

  var btnClearHistorique = document.getElementById("btnClearHistorique");
  if(btnClearHistorique) btnClearHistorique.addEventListener("click", function(){
    confirmDialog("Supprimer définitivement tout l'historique des factures (" +APP.factures.length+ ") ? Les quantités déjà déduites du stock ne seront PAS restituées, et les créances clients liées à ces factures disparaîtront aussi. Cette action est irréversible.", function(){
      APP.factures = [];
      histFilter = "";
      save(); render();
    });
  });

  var mouvSearch = document.getElementById("mouvSearch");
  if(mouvSearch) mouvSearch.addEventListener("input", function(){ mouvFilter=mouvSearch.value; render(); });

  var btnClearMouvements = document.getElementById("btnClearMouvements");
  if(btnClearMouvements) btnClearMouvements.addEventListener("click", function(){
    confirmDialog("Supprimer définitivement tout l'historique des mouvements de stock ? Cette action n'affecte pas les quantités actuelles en stock, seulement l'historique.", function(){
      APP.mouvements = [];
      mouvFilter = "";
      save(); render();
    });
  });

  // STOCK: réapprovisionnement (achat fournisseur)
  var btnAddReappro = document.getElementById("btnAddReappro");
  if(btnAddReappro) btnAddReappro.addEventListener("click", function(){
    var nomArticle = document.getElementById("rArticle").value.trim();
    var prod = APP.produits.find(function(p){ return p.designation.trim().toLowerCase()===nomArticle.toLowerCase(); });
    if(!prod){ alert("Article introuvable dans le stock. Vérifiez l'orthographe ou ajoutez d'abord l'article ci-dessus."); return; }
    var qte = Number(document.getElementById("rQte").value)||0;
    if(qte<=0){ alert("Quantité invalide."); return; }
    var prixAchatSaisi = Number(document.getElementById("rPrixAchat").value)||0;
    var fournisseur = document.getElementById("rFournisseur").value.trim();
    prod.qte += qte;
    if(prixAchatSaisi>0) prod.prixAchat = prixAchatSaisi;
    if(!APP.achats) APP.achats=[];
    APP.achats.push({
      id: uid(), date: todayISO(), produitId: prod.id, designation: prod.designation,
      qte: qte, prixAchat: prod.prixAchat, fournisseur: fournisseur, utilisateur: utilisateurActif()
    });
    logMouvement(prod.id, prod.designation, "entree", qte, "Réapprovisionnement"+(fournisseur? " — fournisseur : "+fournisseur : ""));
    save(); render();
  });

  // STOCK: éditer / supprimer (délégation)
  Array.prototype.forEach.call(app.querySelectorAll('[data-action="editProduit"]'), function(btn){
    btn.addEventListener("click", function(){
      var p = APP.produits.find(function(x){ return x.id===btn.getAttribute("data-id"); });
      if(!p) return;
      var nq = prompt("Nouvelle quantité en stock pour \""+p.designation+"\" :", p.qte);
      if(nq===null) return;
      var val = Number(nq);
      if(isNaN(val) || val<0){ alert("Quantité invalide."); return; }
      var diff = val - p.qte;
      p.qte = val;
      if(diff!==0) logMouvement(p.id, p.designation, "ajustement", diff, "Ajustement manuel de stock ("+(diff>0?"+":"")+diff+")");
      save(); render();
    });
  });
  Array.prototype.forEach.call(app.querySelectorAll('[data-action="delProduit"]'), function(btn){
    btn.addEventListener("click", function(){
      var id = btn.getAttribute("data-id");
      var p = APP.produits.find(function(x){ return x.id===id; });
      if(!p) return;
      confirmDialog('Supprimer l\'article "'+p.designation+'" du stock ?', function(){
        if(p.qte>0) logMouvement(p.id, p.designation, "sortie", p.qte, "Suppression de l'article du stock");
        APP.produits = APP.produits.filter(function(x){ return x.id!==id; });
        save(); render();
      });
    });
  });

  // FACTURE: champs client
  var dClientNom = document.getElementById("dClientNom");
  if(dClientNom) dClientNom.addEventListener("input", function(){
    draft.clientNom = dClientNom.value;
    if(!draft.clientAdresse){
      var adr = findClientAdresse(dClientNom.value);
      if(adr){
        draft.clientAdresse = adr;
        var adrEl = document.getElementById("dClientAdresse");
        if(adrEl) adrEl.value = adr;
      }
    }
    persistDraft();
  });
  var dClientAdresse = document.getElementById("dClientAdresse");
  if(dClientAdresse) dClientAdresse.addEventListener("input", function(){ draft.clientAdresse=dClientAdresse.value; persistDraft(); });
  var dDate = document.getElementById("dDate");
  if(dDate) dDate.addEventListener("change", function(){ draft.date=dDate.value; persistDraft(); });
  var dAvance = document.getElementById("dAvance");
  if(dAvance) dAvance.addEventListener("input", function(){
    draft.avance = Number(dAvance.value)||0;
    var resteEl = document.getElementById("dResteAffiche");
    if(resteEl) resteEl.textContent = fmt(Math.max(0, draftTotal()-draft.avance));
    persistDraft();
  });

  // FACTURE: lignes
  function sanitizeDigits(inp){
    var pos = inp.selectionStart;
    var before = inp.value;
    var cleaned = before.replace(/[^0-9]/g,"");
    if(cleaned!==before){
      var removedBefore = before.slice(0,pos).length - before.slice(0,pos).replace(/[^0-9]/g,"").length;
      inp.value = cleaned;
      var newPos = Math.max(0, pos - removedBefore);
      try{ inp.setSelectionRange(newPos,newPos); }catch(e){}
    }
    return cleaned;
  }
  Array.prototype.forEach.call(app.querySelectorAll('[data-field]'), function(inp){
    inp.addEventListener("input", function(){
      var idx = Number(inp.getAttribute("data-idx"));
      var field = inp.getAttribute("data-field");
      if(!draft.lignes[idx]) return;
      if(field==="designation"){
        draft.lignes[idx].designation = inp.value;
        var prod = APP.produits.find(function(p){ return p.designation===inp.value; });
        if(prod && (!draft.lignes[idx].pu || draft.lignes[idx].pu===0)){
          draft.lignes[idx].pu = prod.prixVente;
        }
      } else if(field==="qte"){
        draft.lignes[idx].qte = Number(sanitizeDigits(inp))||0;
      } else if(field==="pu"){
        draft.lignes[idx].pu = Number(sanitizeDigits(inp))||0;
      }
      persistDraft();
      render();
    });
  });
  var btnAddLigne = document.getElementById("btnAddLigne");
  if(btnAddLigne) btnAddLigne.addEventListener("click", function(){
    draft.lignes.push({designation:"",qte:1,pu:0});
    persistDraft();
    render();
  });
  Array.prototype.forEach.call(app.querySelectorAll('[data-action="delLigne"]'), function(btn){
    btn.addEventListener("click", function(){
      var idx = Number(btn.getAttribute("data-idx"));
      draft.lignes.splice(idx,1);
      if(draft.lignes.length===0) draft.lignes.push({designation:"",qte:1,pu:0});
      persistDraft();
      render();
    });
  });

  var btnClearDraft = document.getElementById("btnClearDraft");
  if(btnClearDraft) btnClearDraft.addEventListener("click", function(){
    confirmDialog("Vider le formulaire de facture en cours ?", function(){ resetDraft(); render(); });
  });

  var btnSaveFacture = document.getElementById("btnSaveFacture");
  if(btnSaveFacture) btnSaveFacture.addEventListener("click", function(){
    var lignesValides = draft.lignes.filter(function(l){ return l.designation.trim() && l.qte>0; });
    if(lignesValides.length===0){ alert("Ajoutez au moins un article avec une quantité valide."); return; }
    if(!draft.clientNom.trim()){
      if(!confirm("Aucun nom de client renseigné. Continuer quand même ?")) return;
    }
    // vérification du stock disponible
    var insuffisant = [];
    lignesValides.forEach(function(l){
      var prod = APP.produits.find(function(p){ return p.designation===l.designation; });
      if(prod && prod.qte < l.qte) insuffisant.push(prod.designation+" (stock: "+prod.qte+", demandé: "+l.qte+")");
    });
    function finaliser(){
      var numeroVente = numeroFacture(APP.nextNumero);
      lignesValides.forEach(function(l){
        var prod = APP.produits.find(function(p){ return p.designation===l.designation; });
        if(prod){
          prod.qte = Math.max(0, prod.qte - l.qte);
          logMouvement(prod.id, prod.designation, "sortie", l.qte, "Vente — facture "+numeroVente);
        }
      });
      var total = lignesValides.reduce(function(s,l){ return s+ligneTotal(l); },0);
      var avance = Number(draft.avance)||0;
      var facture = {
        id: uid(),
        numero: APP.nextNumero,
        date: draft.date || todayISO(),
        clientNom: draft.clientNom.trim(),
        clientAdresse: draft.clientAdresse.trim(),
        lignes: lignesValides.map(function(l){ return {designation:l.designation, qte:l.qte, pu:l.pu}; }),
        total: total,
        avance: avance,
        paiements: [],
        reste: Math.max(0, total-avance)
      };
      APP.factures.push(facture);
      APP.nextNumero += 1;
      save();
      resetDraft();
      currentTab = (APP.settings && APP.settings.masquerHistorique) ? "dashboard" : "historique";
      render();
      printFacture(facture);
    }
    if(insuffisant.length){
      confirmDialog("Stock insuffisant pour : "+insuffisant.join(", ")+". Enregistrer quand même ?", finaliser);
    } else {
      finaliser();
    }
  });

  // HISTORIQUE
  Array.prototype.forEach.call(app.querySelectorAll('[data-action="printFacture"]'), function(btn){
    btn.addEventListener("click", function(){
      var f = APP.factures.find(function(x){ return x.id===btn.getAttribute("data-id"); });
      if(f) printFacture(f);
    });
  });
  Array.prototype.forEach.call(app.querySelectorAll('[data-action="encaisser"]'), function(btn){
    btn.addEventListener("click", function(){
      openPaiementDialog(btn.getAttribute("data-id"));
    });
  });
  Array.prototype.forEach.call(app.querySelectorAll('[data-action="delFacture"]'), function(btn){
    btn.addEventListener("click", function(){
      var id = btn.getAttribute("data-id");
      var f = APP.factures.find(function(x){ return x.id===id; });
      if(!f) return;
      var paye = facturePaye(f);
      var msg = "Annuler la facture "+numeroFacture(f.numero)+" ? Les quantités seront remises en stock.";
      if(paye>0) msg += " Attention : "+fmt(paye)+" avai(en)t déjà été encaissé(s) sur cette facture.";
      confirmDialog(msg, function(){
        f.lignes.forEach(function(l){
          var prod = APP.produits.find(function(p){ return p.designation===l.designation; });
          if(prod){
            prod.qte += l.qte;
            logMouvement(prod.id, prod.designation, "entree", l.qte, "Annulation facture "+numeroFacture(f.numero));
          }
        });
        APP.factures = APP.factures.filter(function(x){ return x.id!==id; });
        save(); render();
      });
    });
  });

  // CLIENTS & CRÉANCES
  var clientsSearch = document.getElementById("clientsSearch");
  if(clientsSearch) clientsSearch.addEventListener("input", function(){ clientsFilter=clientsSearch.value; render(); });
  Array.prototype.forEach.call(app.querySelectorAll('[data-action="voirClient"]'), function(btn){
    btn.addEventListener("click", function(){
      var nom = btn.getAttribute("data-nom");
      selectedClient = (selectedClient===nom) ? null : nom;
      render();
    });
  });
  Array.prototype.forEach.call(app.querySelectorAll('[data-action="saveFiche"]'), function(btn){
    btn.addEventListener("click", function(){
      var nom = btn.getAttribute("data-nom");
      var tel = document.getElementById("cliTel").value.trim();
      var adresse = document.getElementById("cliAdresse").value.trim();
      var notes = document.getElementById("cliNotes").value.trim();
      if(!APP.clients) APP.clients=[];
      var rec = APP.clients.find(function(x){ return (x.nom||"").trim().toLowerCase()===nom.trim().toLowerCase(); });
      if(!rec){ rec = {id:uid(), nom:nom}; APP.clients.push(rec); }
      rec.nom = nom; rec.tel = tel; rec.adresse = adresse; rec.notes = notes;
      save();
      ficheJustSaved = true;
      render();
      setTimeout(function(){ ficheJustSaved = false; render(); }, 2200);
    });
  });

  // PARAMÈTRES
  var btnSaveShop = document.getElementById("btnSaveShop");
  if(btnSaveShop) btnSaveShop.addEventListener("click", function(){
    APP.shop = {
      nom: document.getElementById("sNom").value.trim(),
      activite: document.getElementById("sActivite").value.trim(),
      detail: document.getElementById("sDetail").value.trim(),
      adresse: document.getElementById("sAdresse").value.trim(),
      tel1: document.getElementById("sTel1").value.trim(),
      tel2: document.getElementById("sTel2").value.trim(),
      telAutre: document.getElementById("sTelAutre").value.trim()
    };
    save(); render();
  });

  var btnSaveSettings = document.getElementById("btnSaveSettings");
  if(btnSaveSettings) btnSaveSettings.addEventListener("click", function(){
    if(!APP.settings) APP.settings={};
    APP.settings.utilisateurActif = document.getElementById("sUtilisateur").value.trim();
    APP.settings.seuilDetteJours = Number(document.getElementById("sSeuilDette").value)||30;
    save(); render();
  });

  var btnSavePassword = document.getElementById("btnSavePassword");
  if(btnSavePassword) btnSavePassword.addEventListener("click", function(){
    if(!APP.settings) APP.settings={};
    var np = document.getElementById("sMotDePasse").value.trim();
    if(!np){ alert("Le mot de passe ne peut pas être vide."); return; }
    APP.settings.motDePasse = np;
    save(); render();
    alert("Mot de passe mis à jour.");
  });

  var sMasquerHistorique = document.getElementById("sMasquerHistorique");
  if(sMasquerHistorique) sMasquerHistorique.addEventListener("change", function(){
    if(!APP.settings) APP.settings={};
    APP.settings.masquerHistorique = sMasquerHistorique.checked;
    save(); render();
  });

  var btnSaveTheme = document.getElementById("btnSaveTheme");
  if(btnSaveTheme) btnSaveTheme.addEventListener("click", function(){
    if(!APP.settings) APP.settings={};
    APP.settings.theme = {
      bg: document.getElementById("thBg").value,
      panel: document.getElementById("thPanel").value,
      panel2: document.getElementById("thPanel2").value,
      accent: document.getElementById("thAccent").value,
      text: document.getElementById("thText").value
    };
    applyTheme();
    save(); render();
  });
  var btnResetTheme = document.getElementById("btnResetTheme");
  if(btnResetTheme) btnResetTheme.addEventListener("click", function(){
    APP.settings.theme = { bg:"#f0f4f8", panel:"#ffffff", panel2:"#eef2f7", accent:"#e8a23d", text:"#1a2533" };
    applyTheme();
    save(); render();
  });

  var btnPrintRapport = document.getElementById("btnPrintRapport");
  if(btnPrintRapport) btnPrintRapport.addEventListener("click", function(){
    var dateInp = document.getElementById("sRapportDate");
    var d = (dateInp && dateInp.value) ? dateInp.value : todayISO();
    printRapportJournalier(d);
  });

  var btnReset = document.getElementById("btnReset");
  if(btnReset) btnReset.addEventListener("click", function(){
    confirmDialog("Voulez-vous vraiment réinitialiser toutes les données (stock, factures) ? Cette action est irréversible.", function(){
      APP = defaultApp();
      applyTheme();
      save();
      currentTab = "dashboard";
      render();
    });
  });
}

/* ============ CONNEXION ============ */
function isAuthenticated(){
  try{ return sessionStorage.getItem(AUTH_KEY)==="ok"; }catch(e){ return false; }
}
function showLogin(){
  document.body.classList.add("locked");
  document.getElementById("loginScreen").style.display = "flex";
  var pwd = document.getElementById("loginPassword");
  pwd.value = "";
  document.getElementById("loginError").textContent = "";
  setTimeout(function(){ pwd.focus(); }, 50);
}
function hideLogin(){
  document.body.classList.remove("locked");
  document.getElementById("loginScreen").style.display = "none";
}
function tryLogin(){
  var pwd = document.getElementById("loginPassword");
  var attendu = (APP.settings && APP.settings.motDePasse) || "bhds123";
  if(pwd.value === attendu){
    try{ sessionStorage.setItem(AUTH_KEY, "ok"); }catch(e){}
    hideLogin();
    render();
  } else {
    document.getElementById("loginError").textContent = "Mot de passe incorrect.";
    pwd.value = "";
    pwd.focus();
  }
}
function setupAuthHandlers(){
  var btnLogin = document.getElementById("btnLogin");
  if(btnLogin) btnLogin.addEventListener("click", tryLogin);
  var pwd = document.getElementById("loginPassword");
  if(pwd) pwd.addEventListener("keydown", function(e){ if(e.key==="Enter") tryLogin(); });
  var btnLogout = document.getElementById("btnLogout");
  if(btnLogout) btnLogout.addEventListener("click", function(){
    try{ sessionStorage.removeItem(AUTH_KEY); }catch(e){}
    showLogin();
  });
}

/* ============ DÉMARRAGE ============ */
load();
applyTheme();
setupAuthHandlers();
if(isAuthenticated()){
  render();
} else {
  showLogin();
}
initFirebaseSync();

/* ============ INSTALLATION PWA (Ajouter à l'écran d'accueil) ============ */
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(e){
      console.warn("Service worker non enregistré:", e);
    });
  });
}

var deferredInstallPrompt = null;
var btnInstall = document.getElementById("btnInstallApp");

window.addEventListener("beforeinstallprompt", function(e){
  e.preventDefault();
  deferredInstallPrompt = e;
  if(btnInstall) btnInstall.style.display = "";
});

if(btnInstall){
  btnInstall.addEventListener("click", function(){
    if(!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.then(function(){
      deferredInstallPrompt = null;
      btnInstall.style.display = "none";
    });
  });
}

window.addEventListener("appinstalled", function(){
  if(btnInstall) btnInstall.style.display = "none";
  deferredInstallPrompt = null;
});

})();
</script>
